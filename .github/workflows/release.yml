name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------
  # Compute version from tag
  # ---------------------------------------------------------------------
  version:
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.v.outputs.version_name }}
      version_code: ${{ steps.v.outputs.version_code }}
    steps:
      - id: v
        run: |
          NAME="${GITHUB_REF_NAME#v}"
          echo "version_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------
  # Android: build signed AAB → upload to Play (internal) → attach to GH Release
  # ---------------------------------------------------------------------
  android:
    needs: version
    runs-on: ubuntu-latest
    env:
      APP_VERSION_NAME: ${{ needs.version.outputs.version_name }}
      APP_VERSION_CODE: ${{ needs.version.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 -d > androidApp/google-services.json

      - name: Fastlane android release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: bundle exec fastlane android release

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: androidApp/build/outputs/apk/release/*.apk
          generate_release_notes: true

  # ---------------------------------------------------------------------
  # iOS: build signed IPA → upload build to App Store Connect/TestFlight
  # ---------------------------------------------------------------------
  ios:
    needs: version
    runs-on: macos-26
    timeout-minutes: 90
    env:
      APP_VERSION_NAME: ${{ needs.version.outputs.version_name }}
      APP_VERSION_CODE: ${{ needs.version.outputs.version_code }}
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Restore iOS Firebase configuration
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          test -n "$GOOGLE_SERVICE_INFO_PLIST"
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" | base64 -D > iosApp/iosApp/GoogleService-Info.plist

      - name: Install distribution certificate and provisioning profile
        env:
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          for variable in IOS_DIST_CERT_P12 IOS_DIST_CERT_PASSWORD IOS_PROVISIONING_PROFILE; do
            test -n "${!variable}" || { echo "$variable is not configured"; exit 1; }
          done
          CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/appstore.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/appstore-profile.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/logica-ci.keychain-db"
          IOS_KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          printf '%s' "$IOS_DIST_CERT_P12" | base64 -D > "$CERTIFICATE_PATH"
          printf '%s' "$IOS_PROVISIONING_PROFILE" | base64 -D > "$PROFILE_PATH"
          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 7200 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$PROFILE_PLIST")
          PROFILE_DESTINATION="$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$PROFILE_DESTINATION"
          echo "IOS_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_PATH=$PROFILE_DESTINATION" >> "$GITHUB_ENV"

      - name: Build signed IPA and upload to App Store Connect
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: bundle exec fastlane ios release

      - name: Retain IPA and dSYM
        uses: actions/upload-artifact@v4
        with:
          name: logica-ios-${{ needs.version.outputs.version_name }}
          path: |
            build/ios/Logica.ipa
            build/ios/Logica.app.dSYM.zip
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing material
        if: always()
        run: |
          if [ -n "${IOS_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$IOS_KEYCHAIN_PATH" || true
          fi
          if [ -n "${IOS_PROFILE_PATH:-}" ]; then
            rm -f "$IOS_PROFILE_PATH"
          fi
